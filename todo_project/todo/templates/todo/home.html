{% extends "todo/base.html" %}
{% block content %}
    <h1>My Tasks</h1>
    <ul>
        {% for task in tasks %}
            <li>
                <a href="{% url 'detail' task.pk %}">
                    {{ task.title }}
                </a>
            </li>
        {% endfor %}
    </ul>
    <a href="{% url 'add' %}">Add Task</a>
{% endblock %}
